[project]
authors = [{name = "Jianyuan Wang", email = "jianyuan@robots.ox.ac.uk"}]
dependencies = [
    "numpy<2",
    "pillow",
    "huggingface-hub",
    "einops",
    "safetensors",
    "opencv-python",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "gradio==5.17.1",
    "viser>=0.2.23",
    "tqdm>=4.67.1",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "scipy>=1.15.3",
    "onnxruntime>=1.22.0",
    "requests>=2.32.3",
    "trimesh>=4.6.10",
    "matplotlib>=3.10.3",
    "pycolmap>=3.11.1",
    "pyceres>=2.4",
    "pydantic==2.10.6",
    "onnxscript>=0.2.6",
    "onnx>=1.18.0",
    "onnxruntime-gpu>=1.22.0",
    "torchviz>=0.0.3",
]
name = "vggt"
requires-python = ">= 3.10"
version = "0.0.1"

[project.optional-dependencies]
demo = [
    "gradio==5.17.1",
    "viser==0.2.23",
    "tqdm",
    "hydra-core",
    "omegaconf",
    "opencv-python",
    "scipy",
    "onnxruntime",
    "requests",
    "trimesh",
    "matplotlib",
]

# Using setuptools as the build backend
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# setuptools configuration
[tool.setuptools.packages.find]
where = ["."]
include = ["vggt*"]

# Pixi configuration
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
vggt = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
demo = { features = ["demo"], solve-group = "default" }

[tool.pixi.tasks]

[dependency-groups]
dev = [
    "flake8>=7.2.0",
    "mypy>=1.15.0",
    "pylsp-mypy>=0.7.0",
    "python-lsp-black>=2.0.0",
    "python-lsp-isort>=0.2.1",
    "python-lsp-server>=1.12.2",
]
